services:
  redis:
    # Redis Stack bundles Redis with vector search (RediSearch) and JSON.
    # Pin an exact version once the project picks one.
    image: redis/redis-stack:latest
    container_name: tome-redis
    ports:
      - "127.0.0.1:6379:6379" # Redis
      - "127.0.0.1:8001:8001" # RedisInsight UI
    environment:
      # Persist the index to disk so a restart does not lose it.
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - tome-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tome-redis-data:
